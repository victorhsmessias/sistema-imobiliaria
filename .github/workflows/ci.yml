name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-gate:
    name: Isolamento e anonimizacao
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imob
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d imob"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # A suite de midia faz upload de verdade e baixa o arquivo de volta para
      # conferir que o EXIF sumiu. Sem storage real isso nao se testa.
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://app_user:app_user_dev@localhost:5434/imob
      DATABASE_URL_MIGRATOR: postgres://app_migrator:app_migrator_dev@localhost:5434/imob
      DATABASE_URL_TEST_ORACLE: postgres://postgres:postgres@localhost:5434/imob
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: imob-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - run: pnpm install --frozen-lockfile

      - name: Bucket de midia
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set ci http://localhost:9000 minioadmin minioadmin
          mc mb --ignore-existing ci/imob-media
          mc anonymous set none ci/imob-media

      # O service container do Actions nao executa /docker-entrypoint-initdb.d,
      # entao o bootstrap de roles roda como um passo explicito.
      - name: Bootstrap de roles
        run: psql "$DATABASE_URL_TEST_ORACLE" -v ON_ERROR_STOP=1 -f packages/db/sql/00_bootstrap_roles.sql

      - name: Migrations, RLS e views
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      # O gate. Se qualquer identificador de parceiro atravessar a fronteira de
      # tenant num resultado de busca, o build fica vermelho e o deploy para.
      - name: Suite de isolamento e anonimizacao
        run: pnpm test:rls

      # Auth, carteira, busca e midia -- incluindo o teste que prova que o
      # EXIF (GPS, autor, copyright) nao sobrevive ao upload.
      - name: Suite da API
        run: pnpm test:api
        env:
          JWT_SECRET: segredo-somente-para-ci-com-mais-de-32-caracteres
          WEB_PUBLIC_URL: http://localhost:3000
          COOKIE_DOMAIN: localhost
          COOKIE_SECURE: 'false'

  # As imagens sao o artefato do deploy: se um Dockerfile apodrecer (pacote que
  # saiu de dependencies, arquivo que deixou de ser copiado), o erro tem que
  # aparecer aqui, e nao no EasyPanel as 23h.
  images:
    name: Imagens de producao
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Imagem do Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
